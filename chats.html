<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickChat — No Login Needed</title>
  <link rel="stylesheet" href="chats.css">
</head>
<body>

<!-- ══ JOIN SCREEN ══ -->
<div id="joinScreen">
  <div class="join-box">
    <div class="join-logo">💬</div>
    <h1>Quick<span>Chat</span></h1>
    <p>No account needed. Just pick a username and start chatting with everyone in the room instantly.</p>

    <div class="input-group">
      <label>Your Username</label>
      <input
        type="text"
        id="usernameInput"
        maxlength="20"
        placeholder="e.g. CoolStudent99"
        oninput="updateCharCount()"
        onkeydown="if(event.key==='Enter') joinChat()"
      >
      <span class="char-count" id="charCount">0/20</span>
    </div>

    <button class="random-btn" onclick="randomUsername()">🎲 Generate Random Username</button>
    <button class="join-btn" id="joinBtn" onclick="joinChat()" disabled>Enter Chat Room →</button>

    <div class="join-footer">
      <div class="dot"></div>
      <span id="liveCount">Loading...</span> people online right now
    </div>
  </div>
</div>

<!-- ══ CHAT APP ══ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">💬 QuickChat</div>
      <div class="room-badge">#general</div>
    </div>
    <div class="topbar-right">
      <div class="online-pill">
        <div class="dot"></div>
        <span id="onlineCount">1</span> online
      </div>
      <button class="leave-btn" onclick="leaveChat()">✕ Leave</button>
    </div>
  </div>

  <div class="chat-layout">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-head">Online Users</div>
      <div class="user-list" id="userList"></div>
    </div>

    <!-- Chat area -->
    <div class="chat-area">
      <div id="messages">
        <div class="welcome-banner">
          👋 Welcome to <strong>QuickChat</strong>! Messages are shared across all open tabs. Be kind ✌️
        </div>
      </div>

      <div class="typing-indicator" id="typingIndicator"></div>

      <!-- Emoji panel -->
      <div class="emoji-panel" id="emojiPanel"></div>

      <div class="scroll-fab" id="scrollFab" onclick="scrollToBottom()" title="Scroll to bottom">↓</div>

      <div class="input-bar">
        <div class="input-inner">
          <button class="emoji-picker-btn" onclick="toggleEmoji()" title="Emoji">😊</button>
          <input
            type="text"
            id="msgInput"
            placeholder="Type a message..."
            maxlength="500"
            oninput="handleTyping()"
            onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); sendMsg(); }"
          >
          <button class="send-btn" onclick="sendMsg()" title="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ⚠️ type="module" zaroori hai Firebase ES imports ke liye -->
<script type="module" src="chats.js"></script>
</body>
</html>
